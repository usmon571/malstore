<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MalStore</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #0f0f0f);
    --hint: var(--tg-theme-hint-color, #8a8a8e);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --accent: var(--tg-theme-button-color, #2ea6ff);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --line: color-mix(in srgb, var(--hint) 25%, transparent);
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:12px 12px 90px;
    background:var(--bg); color:var(--text);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  .card{background:var(--card); border-radius:14px; padding:14px; margin-bottom:12px}
  .label{font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--hint); margin-bottom:8px}
  textarea,input{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px;
    background:var(--bg); color:var(--text); font:inherit; outline:none;
  }
  textarea{resize:vertical; min-height:70px}
  input:focus,textarea:focus{border-color:var(--accent)}
  .row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .size{flex:0 0 76px; font-weight:700}
  .cny{flex:1; min-width:0}
  .out{flex:0 0 auto; font-size:13px; font-weight:700; color:var(--accent); white-space:nowrap}
  .muted{font-size:12.5px; color:var(--hint)}
  .chips{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
  .chip{
    border:1px solid var(--line); border-radius:999px; padding:6px 13px;
    font-size:13px; font-weight:600; background:var(--bg); color:var(--text); cursor:pointer;
  }
  .chip.on{background:var(--accent); color:var(--accent-text); border-color:var(--accent)}
  .total{display:flex; justify-content:space-between; align-items:baseline; padding:7px 0}
  .total b{font-size:17px}
  .preview{white-space:pre-wrap; font-size:13.5px; line-height:1.5}
  .warn{color:#e0533d; font-size:12.5px; margin-top:8px; display:none}
  h2{margin:0 0 4px; font-size:17px}
</style>
</head>
<body>

<div class="card">
  <div class="label">Mahsulot nomi</div>
  <textarea id="title" rows="3"></textarea>
  <div class="muted" style="margin-top:6px">Tarjima g'aliz bo'lsa — shu yerda tahrirlang</div>
</div>

<div class="card">
  <div class="label">Poizon narxi (¥)</div>
  <div id="rows"></div>
  <div class="muted" id="rateNote"></div>
  <div class="warn" id="warn">Barcha hajmlar uchun narx kiriting</div>
</div>

<div class="card">
  <div class="label">Ustama</div>
  <input id="markup" inputmode="decimal" placeholder="masalan: 25% yoki 300000">
  <div class="chips">
    <button class="chip" data-m="15%">15%</button>
    <button class="chip on" data-m="25%">25%</button>
    <button class="chip" data-m="35%">35%</button>
    <button class="chip" data-m="50%">50%</button>
  </div>
</div>

<div class="card">
  <div class="label">Yakuniy narxlar</div>
  <div id="totals"></div>
</div>

<div class="card">
  <div class="label">Post ko'rinishi</div>
  <div class="preview" id="preview"></div>
</div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();

function loadData(){
  try{
    const raw = decodeURIComponent(escape(atob(location.hash.slice(1))));
    return JSON.parse(raw);
  }catch(e){
    return {title:"", sizes:[100], rate:1761.49, kargoRate:83880, overhead:250,
            arrival:"", specs:{}, channel:"@malstoreoriginal", contact:"", brand:"Original"};
  }
}
const D = loadData();

const titleEl = document.getElementById("title");
const rowsEl  = document.getElementById("rows");
const markupEl= document.getElementById("markup");
titleEl.value = D.title || "";
markupEl.value = "25%";
document.getElementById("rateNote").textContent =
  `Kurs: 1 ¥ = ${fmtNum(D.rate)} so'm · Avto Kargo: ${fmtNum(D.kargoRate)} so'm/kg`;

// hajm qatorlari
D.sizes.forEach(size=>{
  const row = document.createElement("div");
  row.className = "row";
  row.innerHTML =
    `<div class="size">${trim(size)} ml</div>
     <div class="cny"><input inputmode="decimal" placeholder="¥" data-size="${size}"></div>
     <div class="out" data-out="${size}">—</div>`;
  rowsEl.appendChild(row);
});

function trim(n){ return Number(n).toString(); }
function fmtNum(n){ return Math.round(n).toLocaleString("ru-RU").replace(/ /g," "); }
function fmtUzs(n){ return fmtNum(Math.round(n/1000)*1000) + " so'm"; }

function weightOf(size){ return (Number(size) + D.overhead)/1000; }

function applyMarkup(base, text){
  const t = (text||"").trim().replace(/\s/g,"").replace(",",".");
  if(!t) return null;
  if(t.endsWith("%")){
    const p = parseFloat(t.slice(0,-1));
    return isNaN(p) ? null : base*(1+p/100);
  }
  const v = parseFloat(t);
  return isNaN(v) ? null : base+v;
}

function calc(){
  const markupText = markupEl.value;
  const finals = {}, lines = [];
  let missing = false;

  D.sizes.forEach(size=>{
    const input = rowsEl.querySelector(`input[data-size="${size}"]`);
    const out   = rowsEl.querySelector(`[data-out="${size}"]`);
    const cny   = parseFloat((input.value||"").replace(",","."));
    if(isNaN(cny)){ out.textContent = "—"; missing = true; return; }

    const base = cny * D.rate;
    const deliv = weightOf(size) * D.kargoRate;
    const fin = applyMarkup(base + deliv, markupText);
    if(fin === null){ out.textContent = "—"; missing = true; return; }

    out.textContent = fmtUzs(fin);
    finals[`${trim(size)} ml`] = fmtUzs(fin);
    lines.push({size, cny, base, deliv, fin});
  });

  document.getElementById("warn").style.display = missing ? "block" : "none";

  document.getElementById("totals").innerHTML = lines.length
    ? lines.map(l=>
        `<div class="total"><span>🧴 ${trim(l.size)} ml
         <div class="muted">${fmtUzs(l.base)} + 🚚 ${fmtUzs(l.deliv)} · ${weightOf(l.size).toFixed(2)} kg</div>
         </span><b>${fmtUzs(l.fin)}</b></div>`).join("")
    : `<div class="muted">Narxlarni kiriting</div>`;

  document.getElementById("preview").textContent = buildPreview(finals);

  if(tg?.MainButton){
    if(!missing && Object.keys(finals).length){
      tg.MainButton.setText("Botga yuborish").show().enable();
    }else{
      tg.MainButton.hide();
    }
  }
  return finals;
}

function buildPreview(finals){
  const L = [];
  if(titleEl.value.trim()) L.push("✨ " + titleEl.value.trim(), "");
  L.push("➖➖➖➖➖➖➖➖➖➖");
  L.push(`💎 100% ${(D.brand||"Original").toUpperCase()}`);
  L.push("🔍 Poizon (得物) rasmiy tekshiruvidan o'tgan");
  L.push("📦 Original quti va hujjatlari bilan");
  L.push("➖➖➖➖➖➖➖➖➖➖");
  const specs = Object.entries(D.specs||{});
  if(specs.length){
    L.push("", "📋 Xususiyatlari:");
    specs.forEach(([k,v]) => L.push(`▪️ ${k}: ${v}`));
  }
  const keys = Object.keys(finals);
  if(keys.length){
    L.push("");
    if(keys.length === 1) L.push(`💰 Narxi: ${finals[keys[0]]}`);
    else{
      L.push("💰 Narxlari:");
      keys.forEach(k => L.push(`🧴 ${k} — ${finals[k]}`));
    }
  }
  if(D.arrival) L.push(`🚚 Yetkazib berish: ${D.arrival}`);
  L.push("");
  if(D.contact) L.push(`📲 Buyurtma uchun: ${D.contact}`);
  L.push(D.channel || "");
  return L.join("\n");
}

rowsEl.addEventListener("input", calc);
titleEl.addEventListener("input", calc);
markupEl.addEventListener("input", ()=>{
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));
  calc();
});
document.querySelectorAll(".chip").forEach(chip=>{
  chip.addEventListener("click", ()=>{
    document.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));
    chip.classList.add("on");
    markupEl.value = chip.dataset.m;
    calc();
  });
});

tg?.MainButton?.onClick(()=>{
  const finals = calc();
  if(!Object.keys(finals).length) return;
  tg.sendData(JSON.stringify({
    title: titleEl.value.trim(),
    prices: finals,
    markup: markupEl.value.trim(),
  }));
});

calc();
</script>
</body>
</html>
